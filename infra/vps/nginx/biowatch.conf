# Socle Nginx BioWatch — issue #26. Installé par 50-nginx.sh dans
# /etc/nginx/sites-available/, ne pas éditer sur le serveur.
#
# Seul point d'entrée HTTP(S) du VPS. Chaque service (frontend, API) a son
# propre fichier dans /etc/nginx/biowatch.d/ : brancher un service ne
# modifie jamais ce fichier.
#
# Adresses d'écoute et certificat viennent de config.sh. Tant que l'équipe
# n'a pas tranché domaine et certificat, nginx n'écoute que sur la boucle
# locale avec un certificat auto-signé : la chaîne HTTPS est complète mais
# joignable uniquement par tunnel SSH. Voir la section Nginx du README.

# Port 80 : jamais de contenu. Uniquement la redirection vers HTTPS et le
# challenge ACME, que Let's Encrypt fait obligatoirement en HTTP.
server {
    listen __LISTEN_V4__:80 default_server;
    listen __LISTEN_V6__:80 default_server;
    server_name __SERVER_NAME__;

    server_tokens off;

    location /.well-known/acme-challenge/ {
        root __ACME_ROOT__;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen __LISTEN_V4__:443 ssl default_server;
    listen __LISTEN_V6__:443 ssl default_server;
    http2 on;
    server_name __SERVER_NAME__;

    server_tokens off;

    ssl_certificate     __TLS_CERT__;
    ssl_certificate_key __TLS_KEY__;

    # Profil « intermediate » de Mozilla, sans les suites DHE qui exigeraient
    # un fichier dhparam : TLS 1.2 et 1.3 uniquement.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:BioWatchTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Pas de Strict-Transport-Security tant que le certificat est auto-signé :
    # il s'ajoute avec le certificat Let's Encrypt (README).

    # Hérités par les locations des services TANT QU'elles ne déclarent
    # aucun add_header : un seul add_header dans une location les efface
    # tous. Pour le cache, utiliser « expires », qui n'en est pas un.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    include __SERVICES_DIR__/*.conf;
}
