# API — emplacement RÉSERVÉ par #26, branché par #80.
#
# Aucun process API ne tourne encore. Sans ce fichier, /v1/* et /health
# tomberaient dans le fallback du frontend et répondraient 200 avec
# index.html : un faux positif pour tout test de santé. On répond donc un
# 503 explicite.
#
# #80 remplace le contenu de ce fichier par un proxy_pass vers le process
# API, qui écoute UNIQUEMENT en 127.0.0.1 (ou socket unix). Modèle dans la
# section Nginx du README.

location /v1/ {
    default_type application/json;
    return 503 '{"error":"api_not_deployed"}\n';
}

location = /health {
    default_type application/json;
    return 503 '{"error":"api_not_deployed"}\n';
}
