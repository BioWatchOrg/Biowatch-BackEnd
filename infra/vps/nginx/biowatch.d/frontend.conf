# Frontend (SPA Vite) — issue #26.
#
# Les fichiers sont déposés par le déploiement CI (Biowatch-Frontend#76)
# dans FRONTEND_DIR (config.sh). Ce fichier ne change pas à chaque
# déploiement : seul le contenu du répertoire change.

location / {
    root __FRONTEND_DIR__;
    # Routes côté client : toute URL inconnue renvoie l'application.
    try_files $uri $uri/ /index.html;
}

# Point d'entrée de l'application : jamais mis en cache, sinon un
# navigateur garde l'ancienne version après un déploiement.
location = /index.html {
    root __FRONTEND_DIR__;
    expires -1;
}

# Assets fingerprintés par Vite (nom = hash du contenu) : cache long sans
# risque. Un asset absent répond 404 au lieu de renvoyer index.html.
location /assets/ {
    root __FRONTEND_DIR__;
    expires 1y;
    try_files $uri =404;
}
