name: Claude PR Review
on:
  pull_request:
    types: [labeled]
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Manual trigger only: apply the `run-review` label to run this on the PR's latest
    # commit. New commits are NOT auto-reviewed — remove and reapply the label to rerun.
    if: github.event.label.name == 'run-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt_file: .github/claude/reviewer-prompt.md
          use_sticky_comment: true
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue view:*)"
            --disallowedTools "Edit,Write,NotebookEdit"
